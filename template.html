<!doctype html>
<!-- Para Casa: copy this file, fill one <section class="tarefa"> per task; keep the classes, the CSS is print-only. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Para Casa</title>
<style>
  @page { size: A4; margin: 16mm 15mm; }
  * { box-sizing: border-box; }
  body { font: 11.5pt/1.45 Georgia, "Times New Roman", serif; color: #111; margin: 0; }
  h1 { font: 700 20pt/1.1 "Helvetica Neue", Arial, sans-serif; margin: 0 0 2mm; }
  h2 { font: 700 14pt/1.2 "Helvetica Neue", Arial, sans-serif; margin: 0 0 1mm; }
  h3 { font: 700 11.5pt/1.2 "Helvetica Neue", Arial, sans-serif; margin: 5mm 0 1.5mm; text-transform: uppercase; letter-spacing: .04em; break-after: avoid; }
  .capa { border-bottom: 2px solid #111; padding-bottom: 3mm; margin-bottom: 5mm; }
  .meta { font: 10pt "Helvetica Neue", Arial, sans-serif; color: #444; }
  .resumo { width: 100%; border-collapse: collapse; font: 10.5pt "Helvetica Neue", Arial, sans-serif; margin-bottom: 4mm; }
  .resumo td, .resumo th { border: 1px solid #999; padding: 1.5mm 2mm; text-align: left; vertical-align: top; }
  .resumo th { background: #eee; }
  .check { width: 7mm; text-align: center; }
  .tarefa { break-before: page; }
  .tarefa:first-of-type { break-before: auto; }
  .entrega { display: inline-block; font: 700 9.5pt "Helvetica Neue", Arial, sans-serif; border: 1.5px solid #111; padding: .5mm 2mm; margin-bottom: 3mm; }
  .enunciado { border-left: 4px solid #111; background: #f3f3f3; padding: 2mm 4mm; white-space: pre-line; }
  .dica { border: 1px dashed #777; padding: 2mm 4mm; margin: 3mm 0; font-size: 10.5pt; }
  ol.ex > li { margin-bottom: 3mm; break-inside: avoid; }
  .linhas { height: calc(var(--n, 3) * 8mm); background: repeating-linear-gradient(transparent 0 7.6mm, #bbb 7.6mm 8mm); margin-top: 1mm; }
  .fonte { font: 8.5pt "Helvetica Neue", Arial, sans-serif; color: #666; margin-top: 4mm; word-break: break-all; }
</style>
</head>
<body>
<header class="capa">
  <h1>Para Casa — NOME</h1>
  <div class="meta">TURMA · nível NIVEL · gerado em DATA</div>
</header>

<table class="resumo">
  <tr><th class="check">✓</th><th>Entrega</th><th>Matéria</th><th>O que fazer</th></tr>
  <tr><td class="check">☐</td><td>qui 05/11</td><td>Geografia</td><td>…</td></tr>
</table>

<section class="tarefa">
  <h2>Matéria — título</h2>
  <span class="entrega">ENTREGA: quinta, 05/11</span>
  <h3>O que o professor pediu</h3>
  <div class="enunciado">texto exato do AVA, só do nível do aluno</div>
  <h3>Para entender o tema</h3>
  <p>explicação curta</p>
  <h3>Exercícios extras</h3>
  <ol class="ex"><li>pergunta<div class="linhas" style="--n:3"></div></li></ol>
  <div class="fonte">AVA: URL</div>
</section>

</body>
</html>
